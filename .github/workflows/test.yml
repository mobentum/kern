name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            go.sum
            benchmarks/fourway/go.sum
            extensions/*/go.sum

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run go vet
        run: make go-vet

      - name: Run govulncheck
        run: make go-vuln

  discover-extensions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5

      - name: Discover extension modules
        id: discover
        run: |
          MODULES=$(ls -1d extensions/*/go.mod 2>/dev/null | sed 's|/go.mod||' | jq -R -s -c '{module: split("\n")[:-1]}')
          echo "matrix=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Found modules: $MODULES"

  test-root:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            go.sum
            benchmarks/fourway/go.sum

      - name: Build root module
        run: go build ./...

      - name: Test root module
        run: go test -race -count=1 ./...

  test-extensions:
    needs: discover-extensions
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJSON(needs.discover-extensions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build ${{ matrix.module }}
        run: go build ./...
        working-directory: ${{ matrix.module }}

      - name: Test ${{ matrix.module }}
        run: go test -race -count=1 ./...
        working-directory: ${{ matrix.module }}

  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            go.sum
            benchmarks/fourway/go.sum

      - name: Benchmark smoke test
        run: make ci-benchmark-smoke
